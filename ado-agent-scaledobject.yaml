apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ado-playwright-scaledobject
  namespace: ado-agents
spec:
  scaleTargetRef:
    name: ado-playwright-agent
  minReplicaCount: 1
  maxReplicaCount: 5
  pollingInterval: 10
  cooldownPeriod: 60
  triggers:
    - type: azure-pipelines
      metadata:
        poolName: "Linux-ap-pw-aks"
        poolID: "15"
        organizationURL: "https://dev.azure.com/LJTEQSolutionsLLC"
      authenticationRef:
        name: keda-ado-trigger-auth
