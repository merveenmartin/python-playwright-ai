apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: ado-playwright-scaledjob
  namespace: ado-agents
spec:
  jobTargetRef:
    template:
      spec:
        containers:
          - name: ado-playwright-agent
            image: merveenacr.azurecr.io/ado-playwright-agent:2.0
            resources:
              requests:
                cpu: "500m"
                memory: "1Gi"
              limits:
                cpu: "1"
                memory: "2Gi"
            env:
              - name: AZP_URL
                value: "https://dev.azure.com/LJTEQSolutionsLLC"
              - name: AZP_POOL
                value: "Linux-ap-pw-aks"
              - name: AZP_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: azdevops-agent-secret
                    key: AZP_TOKEN
              - name: AZP_AGENT_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
        restartPolicy: Never
  pollingInterval: 10
  maxReplicaCount: 5
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 1
  triggers:
    - type: azure-pipelines
      metadata:
        poolName: "Linux-ap-pw-aks"
        poolID: "15"
        organizationURL: "https://dev.azure.com/LJTEQSolutionsLLC"
      authenticationRef:
        name: keda-ado-trigger-auth
